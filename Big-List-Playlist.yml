# Big List Playlist - every list from https://github.com/MiniMyself/kometa-textfiles as a playlist
# Air-date / release order.
#
# Setup and documentation: https://github.com/MiniMyself/kometa-textfiles/wiki/Big-List#big-list-playlist

templates:
  Episode Playlist:
    text_file: <<text_file>>
    libraries: TV Shows
    sync_mode: sync
    summary: <<summary>>
  Movie Playlist:
    text_file: <<text_file>>
    libraries: Movies
    sync_mode: sync
    summary: <<summary>>
  Mixed Playlist:
    text_file: <<text_file>>
    libraries: Movies, TV Shows
    sync_mode: sync
    summary: <<summary>>

