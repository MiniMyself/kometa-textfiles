# Big List (Timeline) - every collection and playlist from https://github.com/MiniMyself/kometa-textfiles
# In-universe chronological order.
#
# Setup and documentation: https://github.com/MiniMyself/kometa-textfiles/wiki/Big-List

templates:
  Episode Collection:
    run_definition: show
    text_file: <<text_file>>
    collection_order: custom
    builder_level: episode
    collection_mode: hide
    sync_mode: sync
    summary: "Chronological viewing order of all <<collection_name>> episodes"
  Movie Collection:
    run_definition: movie
    text_file: <<text_file>>
    collection_order: custom
    collection_mode: hide
    sync_mode: sync
    summary: "Chronological viewing order of all <<collection_name>> movies"
  Mixed Playlist:
    text_file: <<text_file>>
    libraries: Movies, TV Shows
    sync_mode: sync
    summary: "Chronological viewing order of all <<playlist_name>> movies and episodes"

